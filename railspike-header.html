<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Railspike — A reviewable workflow for AI-assisted feature work</title>
  <style>
    :root { color-scheme: light; --ink: #101010; --paper: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, Helvetica, sans-serif; }
    .site-header { border-bottom: 2px solid var(--ink); background: var(--paper); }
    .header-inner { max-width: 1200px; margin: auto; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
    .brand img { display: block; width: 54px; height: 54px; object-fit: contain; }
    .brand-name { font-size: clamp(1.35rem, 2.5vw, 1.8rem); font-weight: 900; letter-spacing: -.065em; line-height: 1; text-transform: uppercase; }
    .nav { display: flex; gap: 28px; align-items: center; }
    .nav a { color: inherit; text-decoration: none; font-size: .85rem; font-weight: 800; text-transform: uppercase; letter-spacing: .045em; }
    .nav a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
    .nav a:focus-visible, .brand:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
    .nav .nav-primary { padding: 11px 17px; color: #fff; background: var(--ink); border: 2px solid var(--ink); }
    .nav .nav-primary:hover { color: var(--ink); background: #fff; text-decoration: none; }
    @media (max-width: 580px) {
      .header-inner { padding: 12px 16px; gap: 12px; }
      .brand { gap: 8px; }
      .brand img { width: 42px; height: 42px; }
      .brand-name { font-size: 1.25rem; }
      .nav { gap: 12px; }
      .nav a { font-size: .72rem; }
      .nav .nav-primary { padding: 9px 10px; }
      .header-inner { flex-wrap: wrap; }
      .nav { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Railspike home">
        <img src="railspike-logo.png" alt="" width="54" height="54">
        <span class="brand-name">Railspike</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-optional" href="./#workflow">About</a>
        <a href="https://github.com/gulkily/railspike#quick-start">Docs</a>
        <a class="nav-primary" href="./#get-started">Get started <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
</body>
</html>
